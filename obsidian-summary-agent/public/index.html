<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Obsidian Summary Agent</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Obsidian Summary Agent</h1>
    <button id="syncBtn" class="btn btn-primary">동기화된 노트 분석</button>
  </header>

  <section class="input-panel">
    <h2>개별 노트 분석</h2>
    <p class="hint">md 파일을 올리거나 내용을 붙여넣어 즉석에서 분석할 수 있습니다 (보조 경로).</p>
    <div class="input-row">
      <input type="file" id="fileInput" accept=".md,text/markdown,text/plain" />
      <textarea id="pasteInput" placeholder="여기에 md 내용을 붙여넣으세요..."></textarea>
      <button id="manualBtn" class="btn btn-primary">파싱하기</button>
    </div>
    <p id="manualStatus" class="status-text"></p>
  </section>

  <nav class="view-tabs">
    <button class="tab-btn active" data-view="list">목록 보기</button>
    <button class="tab-btn" data-view="topology">토폴로지 보기</button>
  </nav>

  <section id="listView" class="view">
    <div class="search-box">
      <input id="tagSearchInput" type="text" placeholder="태그 검색 (예: 회의, 재고, 이직...)" autocomplete="off" />
      <div id="tagSuggestions" class="suggestions hidden"></div>
    </div>

    <div id="selectedTagBar" class="selected-tag-bar hidden">
      <span>선택된 태그:</span>
      <span id="selectedTagName" class="tag-pill tag-pill-active"></span>
      <button id="clearTagBtn" class="btn btn-secondary btn-sm">전체 태그로 돌아가기</button>
    </div>

    <p id="listStatus" class="status-text"></p>

    <div id="tagListContainer" class="tag-list"></div>
    <div id="sentenceList" class="sentence-list hidden"></div>
  </section>

  <section id="topologyView" class="view hidden">
    <div class="topology-toolbar">
      <button id="zoomInBtn" class="btn btn-secondary btn-sm" title="확대">＋</button>
      <button id="zoomOutBtn" class="btn btn-secondary btn-sm" title="축소">－</button>
      <button id="zoomResetBtn" class="btn btn-secondary btn-sm" title="화면에 맞추기">전체 보기</button>
    </div>
    <svg id="topologySvg"></svg>
    <aside id="topologyDetail" class="topology-detail hidden"></aside>
  </section>

  <div id="noteModal" class="note-modal hidden">
    <div class="note-modal-content">
      <div class="note-modal-header">
        <h3 id="noteModalTitle"></h3>
        <button id="noteModalClose" class="btn btn-secondary btn-sm">닫기</button>
      </div>
      <pre id="noteModalBody" class="note-modal-body"></pre>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
